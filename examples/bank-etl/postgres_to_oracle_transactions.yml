id: postgres_to_oracle_transactions
namespace: egitim.banka

tasks:
  - id: transfer_customers
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - python3 -m venv .venv
      - . .venv/bin/activate
      - python -m pip install --upgrade pip
      - python -m pip install psycopg[binary] oracledb
    env:
      PG_PASSWORD: "{{ secret('BANK_PG_PASSWORD') }}"
      ORACLE_PASSWORD: "{{ secret('BANK_ORACLE_PASSWORD') }}"
    script: |
      import os
      import psycopg
      import oracledb

      # PostgreSQL bağlantısı
      pg_conn = psycopg.connect(
          host="127.0.0.1",
          port=15432,
          dbname="bank_source",
          user="bank_source",
          password=os.environ["PG_PASSWORD"]
      )

      # Oracle bağlantısı (Thin mode)
      oracle_conn = oracledb.connect(
          user="bank_dwh",
          password=os.environ["ORACLE_PASSWORD"],
          dsn="127.0.0.1:11521/FREEPDB1"
      )

      pg_cursor = pg_conn.cursor()
      oracle_cursor = oracle_conn.cursor()

      # Hedef tablo yoksa oluştur
      try:
          oracle_cursor.execute("""
              CREATE TABLE customers (
                  customer_id NUMBER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  customer_name VARCHAR2(255),
                  city VARCHAR2(100)
              )
          """)
          oracle_conn.commit()
      except oracledb.DatabaseError as e:
          error_obj, = e.args
          if error_obj.code != 955:  # ORA-00955: name is already used by an existing object
              raise

      # PostgreSQL'den verileri oku
      pg_cursor.execute("SELECT customer_id, customer_name, city FROM customers")
      rows = pg_cursor.fetchall()

      # Oracle hedefine MERGE (idempotent upsert) ile yaz
      merge_sql = """
          MERGE INTO customers t
          USING (SELECT :1 AS customer_id, :2 AS customer_name, :3 AS city FROM dual) s
          ON (t.customer_id = s.customer_id)
          WHEN MATCHED THEN
              UPDATE SET t.customer_name = s.customer_name, t.city = s.city
          WHEN NOT MATCHED THEN
              INSERT (customer_id, customer_name, city)
              VALUES (s.customer_id, s.customer_name, s.city)
      """

      for row in rows:
          oracle_cursor.execute(merge_sql, row)

      oracle_conn.commit()

      pg_cursor.close()
      pg_conn.close()
      oracle_cursor.close()
      oracle_conn.close()
      print(f"Successfully transferred {len(rows)} customers from PostgreSQL to Oracle.")

triggers:
  - id: daily_at_8am
    disabled: true
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    timezone: "Europe/Istanbul"
