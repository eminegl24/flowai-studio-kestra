id: moose_734167
namespace: company.team

inputs:
  - id: serverUrl
    type: STRING
    defaults: https://kestra.io
    description: The URL of the server to download the PDF from.

tasks:
  - id: downloadPdf
    type: io.kestra.plugin.core.http.Download
    uri: https://huggingface.co/datasets/kestra/datasets/blob/main/pdf/product.pdf
  - id: send_teams_notification
    type: io.kestra.plugin.core.http.Request
    uri: "{{ secret('TEAMS_WEBHOOK_URL') }}"
    method: POST
    contentType: application/json
    body: |
      {"text": {{ ('PDF report downloaded successfully! File: ' ~ outputs.downloadPdf.uri) | toJson }}}

triggers:
  - id: dailySchedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
    disabled: true
